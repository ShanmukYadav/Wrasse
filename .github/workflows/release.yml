name: Release

# A pushed tag v* (for example v0.1.0-beta.1) runs the checks, builds a universal .dmg (Apple
# Silicon and Intel) with its signed updater archive, and creates a DRAFT GitHub release with
# them and latest.json. Publishing the draft (as a pre-release for betas) is a person's job.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden-API check
        run: scripts/check-forbidden-apis.sh
      - name: Security audit sync check
        run: scripts/check-security-audit.sh

      # Same Rust as the project toolchain and CI (ci.yml).
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Tests
        run: cargo test --workspace

      # The bundler checks each update signature against plugins.updater.pubkey, which is empty in
      # the repo: the release build gets the public key from the repository variable.
      - name: Release config
        env:
          WRASSE_UPDATER_PUBKEY: ${{ vars.WRASSE_UPDATER_PUBKEY }}
        run: |
          key=$(printf %s "$WRASSE_UPDATER_PUBKEY" | tr -d ' \r\n')
          [ -n "$key" ] || { echo "The WRASSE_UPDATER_PUBKEY variable is empty."; exit 1; }
          jq -n --arg k "$key" '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}' \
            > app/src-tauri/tauri.release.conf.json

      - name: Signing certificate
        env:
          WRASSE_SIGNING_P12: ${{ secrets.WRASSE_SIGNING_P12 }}
          WRASSE_SIGNING_P12_PASSWORD: ${{ secrets.WRASSE_SIGNING_P12_PASSWORD }}
        run: scripts/ci-signing-keychain.sh --required

      - name: Build and create the draft release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The update key's public half (a repository variable, not secret) and the channel the
          # build checks: pre-release tags (with a "-") are beta.
          WRASSE_UPDATER_PUBKEY: ${{ vars.WRASSE_UPDATER_PUBKEY }}
          WRASSE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          # The updater signing key: repository secrets only, never in the repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Wrasse ${{ github.ref_name }}
          releaseBody: |
            Beta for macOS (Apple Silicon and Intel), not notarized by Apple. The first time you
            open Wrasse, macOS blocks it: open System Settings › Privacy & Security and choose
            Open Anyway. See the README for the steps and what's new in CHANGELOG.md.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          # The app and its update archive only: the .dmg is made below, unsigned. A disk image
          # signed with a certificate macOS doesn't know is blocked before it even opens; an
          # unsigned one opens, and Gatekeeper then asks about the app once.
          args: --target universal-apple-darwin --bundles app --config src-tauri/tauri.release.conf.json

      - name: Signature check
        run: scripts/check-signature.sh target/universal-apple-darwin/release/bundle/macos/Wrasse.app

      - name: Disk image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          dmg="$bundle/dmg/Wrasse_${VERSION}_universal.dmg"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage" "$bundle/dmg"
          ditto "$bundle/macos/Wrasse.app" "$stage/Wrasse.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Wrasse -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg"
          gh release upload "$GITHUB_REF_NAME" "$dmg" --clobber

      - name: Bundle size check
        env:
          BUNDLE_DIR: target/universal-apple-darwin/release/bundle
        run: scripts/check-bundle-size.sh
