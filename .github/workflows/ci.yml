name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Rust is pinned to the version in the project toolchain (./dev.sh rustc --version), so rustfmt and
# clippy agree between CI and local checks. Bump both together.
jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden-API check
        run: scripts/check-forbidden-apis.sh

      - name: Security audit sync check
        run: scripts/check-security-audit.sh

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck and build frontend
        working-directory: app
        run: npm run build

      - name: Scope test
        working-directory: app
        run: npm test

      - name: Rustfmt
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build installer
        working-directory: app
        run: npx tauri build --bundles app,dmg

      - name: Bundle size check
        run: scripts/check-bundle-size.sh

  windows:
    # Windows parity is deferred: the platform-neutral crates must keep compiling
    # for Windows. The app itself and the core's tests (Unix file APIs) are macOS-only for now.
    name: Windows (core compiles)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (wrasse-core, wrasse-fixtures, wrasse-cli)
        run: cargo clippy -p wrasse-core -p wrasse-fixtures -p wrasse-cli -- -D warnings
