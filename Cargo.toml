[workspace]
resolver = "2"
members = [
    "crates/wrasse-core",
    "crates/wrasse-fixtures",
    "crates/wrasse-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ShanmukYadav/wrasse"
rust-version = "1.80"

[workspace.dependencies]
wrasse-core = { path = "crates/wrasse-core" }
wrasse-fixtures = { path = "crates/wrasse-fixtures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
