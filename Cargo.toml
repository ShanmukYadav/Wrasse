[workspace]
resolver = "2"
members = [
    "crates/wrasse-core",
    "crates/wrasse-fixtures",
    "crates/wrasse-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/ShanmukYadav/wrasse"
rust-version = "1.80"

[workspace.dependencies]
wrasse-core = { path = "crates/wrasse-core" }
wrasse-fixtures = { path = "crates/wrasse-fixtures" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The scanner runs optimized even in `tauri dev`, so dev scans take seconds, not minutes.
[profile.dev.package.wrasse-core]
opt-level = 3

# No panics on bad input in shipped code: errors are handled, never unwrapped. Tests may unwrap
# (clippy.toml allows it in #[test] functions and #[cfg(test)] modules).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
